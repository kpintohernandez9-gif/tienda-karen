  <rect x="270" y="988" width="34" height="18" fill="#FFFFFF" stroke="#5C8A3C" stroke-width="1"/>
  <rect x="450" y="1000" width="205" height="60" rx="4" fill="#EDE0EF" stroke="#9170C4" stroke-width="1.5"/>
  <text x="552" y="1026" text-anchor="middle" font-size="12" font-weight="bold" fill="#9170C4">REPISAS</text>
  <text x="552" y="1046" text-anchor="middle" font-size="10" fill="#9170C4">mochilas &amp; accesorios</text>

  <!-- ================= COTAS ================= -->
  <line x1="210" y1="115" x2="660" y2="115" stroke="#5A4852" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="435" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#5A4852">3,00 m</text>
  <line x1="172" y1="160" x2="172" y2="1060" stroke="#5A4852" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text transform="rotate(-90 161 610)" x="161" y="610" text-anchor="middle" font-size="15" font-weight="bold" fill="#5A4852">6,00 m</text>
  <line x1="210" y1="136" x2="495" y2="136" stroke="#4E96BF" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="352" y="128" text-anchor="middle" font-size="12" fill="#4E96BF">1,90 m</text>
  <line x1="525" y1="136" x2="660" y2="136" stroke="#4E96BF" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="592" y="128" text-anchor="middle" font-size="12" fill="#4E96BF">0,90 m</text>
  <line x1="210" y1="272" x2="270" y2="272" stroke="#9A8A92" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="240" y="264" text-anchor="middle" font-size="10" fill="#9A8A92">0,40</text>
  <line x1="270" y1="567" x2="375" y2="567" stroke="#9A8A92" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="322" y="559" text-anchor="middle" font-size="11" fill="#9A8A92">≈0,70 m</text>
  <line x1="495" y1="567" x2="600" y2="567" stroke="#9A8A92" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="547" y="559" text-anchor="middle" font-size="11" fill="#9A8A92">≈0,70 m</text>

  <!-- ================= LEYENDA ================= -->
  <text x="480" y="1120" text-anchor="middle" font-size="20" font-weight="bold" fill="#E36A98">LEYENDA · ZONAS DE LA TIENDA</text>
  <g font-size="13" fill="#5A4852">
    <rect x="60"  y="1146" width="26" height="18" fill="#FFE3F1" stroke="#EADFE6"/>
    <text x="96" y="1160">NIÑAS — vestidos, conjuntos, faldas · barra doble + repisas</text>
    <rect x="60"  y="1188" width="26" height="18" fill="#DCEEFC" stroke="#EADFE6"/>
    <text x="96" y="1202">NIÑOS — franelas, conjuntos, bermudas · barra doble + repisas</text>
    <rect x="60"  y="1230" width="26" height="18" fill="#FFE3D3" stroke="#EADFE6"/>
    <text x="96" y="1244">BEBÉS — bodies, mamelucos, ajuares · estantería + cuna</text>
    <rect x="60"  y="1272" width="26" height="18" fill="#EDE0EF" stroke="#EADFE6"/>
    <text x="96" y="1286">PIJAMAS &amp; UNISEX — pijamas, polos, accesorios de pared</text>
    <rect x="520" y="1146" width="26" height="18" fill="#FFF1CF" stroke="#EADFE6"/>
    <text x="556" y="1160">MESAS CENTRALES — ofertas (1) · combos (2)</text>
    <rect x="520" y="1188" width="26" height="18" fill="#E3F3E0" stroke="#EADFE6"/>
    <text x="556" y="1202">CAJA — mostrador 1,2×0,55 con POS · repisa mochilas</text>
    <rect x="520" y="1230" width="26" height="18" fill="#AEDCEA" stroke="#EADFE6"/>
    <text x="556" y="1244">ESCAPARATE — vidrio 1,90 m · maniquíes sobre podios</text>
    <rect x="520" y="1272" width="26" height="18" fill="#FFFFFF" stroke="#EADFE6"/>
    <text x="556" y="1286">PASILLO central ≈0,70 m · puerta abre hacia afuera</text>
  </g>

  <text x="60" y="1330" font-size="16" font-weight="bold" fill="#E36A98">DETALLES TÉCNICOS</text>
  <g font-size="12.5" fill="#5A4852">
    <text x="60" y="1358">• Barra de colgar a 1,20 m (altura niños) y repisas cada 0,45 m de altura</text>
    <text x="60" y="1384">• Espejo infantil (0,60–1,20 m) junto a la entrada · felpudo de bienvenida</text>
    <text x="60" y="1410">• A/C split 12.000 BTU sobre la puerta — imprescindible para clima tropical</text>
    <text x="60" y="1436">• Iluminación: riel LED con 8 spots + tiras cálidas bajo repisas</text>
    <text x="60" y="1462">• Techo decorado: nubes + guirnalda de globos pastel</text>
    <text x="60" y="1488">• Punto de venta (TPV) con cajón monedero + 1 cámara de seguridad</text>
  </g>

  <line x1="60" y1="1520" x2="900" y2="1520" stroke="#EADFE6" stroke-width="1.5"/>
  <text x="480" y="1548" text-anchor="middle" font-size="12" fill="#9A8A92">KHC KIDS · Proyecto tienda física 3 × 6 m · Plano de planta · Escala aprox. 1:50 · Todas las medidas en metros</text>
</svg>
