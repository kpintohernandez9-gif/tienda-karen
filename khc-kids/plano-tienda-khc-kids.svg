<svg viewBox="0 0 960 1600" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A4852"/>
    </marker>
  </defs>

  <!-- fondo -->
  <rect x="0" y="0" width="960" height="1600" fill="#FFFBF6"/>

  <!-- título -->
  <text x="480" y="58" text-anchor="middle" font-size="30" font-weight="bold" fill="#E36A98">PLANO DE PLANTA · TIENDA KHC KIDS</text>
  <text x="480" y="88" text-anchor="middle" font-size="16" fill="#9A8A92">Local 3,00 × 6,00 m (18 m²) · Escala aprox. 1:50 · Medidas en metros</text>

  <!-- ================= MUROS ================= -->
  <rect x="196" y="146" width="14" height="928" fill="#5A4852"/>
  <rect x="660" y="146" width="14" height="928" fill="#5A4852"/>
  <rect x="196" y="1060" width="478" height="14" fill="#5A4852"/>
  <!-- fachada: escaparate (vidrio) + pilar + puerta -->
  <rect x="210" y="146" width="285" height="14" fill="#AEDCEA" stroke="#4E96BF" stroke-width="1"/>
  <line x1="210" y1="153" x2="495" y2="153" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="495" y="146" width="30" height="14" fill="#5A4852"/>
  <!-- puerta abre hacia afuera -->
  <line x1="525" y1="153" x2="525" y2="18" stroke="#9A8A92" stroke-width="3"/>
  <path d="M 660 153 A 135 135 0 0 0 525 18" fill="none" stroke="#9A8A92" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- ================= ESCAPARATE (interior) ================= -->
  <rect x="240" y="180" width="40" height="40" rx="5" fill="#FFFFFF" stroke="#E36A98" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="330" y="180" width="40" height="40" rx="5" fill="#FFFFFF" stroke="#E36A98" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="305" y="240" text-anchor="middle" font-size="11" fill="#9A8A92">maniquíes sobre podios</text>
  <text x="352" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#4E96BF">ESCAPARATE</text>

  <!-- felpudo -->
  <rect x="535" y="195" width="120" height="60" fill="none" stroke="#9A8A92" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="595" y="230" text-anchor="middle" font-size="10" fill="#9A8A92">felpudo</text>
  <!-- A/C -->
  <rect x="545" y="162" width="100" height="20" fill="none" stroke="#4E96BF" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="595" y="176" text-anchor="middle" font-size="10" fill="#4E96BF">A/C split</text>
  <!-- espejo -->
  <rect x="646" y="200" width="14" height="80" fill="#FFFFFF" stroke="#4E96BF" stroke-width="1.5"/>
  <text x="640" y="246" text-anchor="end" font-size="10" fill="#4E96BF">espejo kids</text>

  <!-- ================= ESTANTERÍAS PAREDES ================= -->
  <!-- NIÑAS izquierda -->
  <rect x="210" y="280" width="60" height="330" fill="#FFE3F1" stroke="#E36A98" stroke-width="1.5"/>
  <line x1="216" y1="385" x2="264" y2="385" stroke="#E36A98" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="216" y1="490" x2="264" y2="490" stroke="#E36A98" stroke-width="1" stroke-dasharray="3 3"/>
  <text transform="rotate(-90 240 445)" x="240" y="445" text-anchor="middle" font-size="17" font-weight="bold" fill="#E36A98">NIÑAS</text>
  <!-- NIÑOS derecha -->
  <rect x="600" y="280" width="60" height="330" fill="#DCEEFC" stroke="#4E96BF" stroke-width="1.5"/>
  <line x1="606" y1="385" x2="654" y2="385" stroke="#4E96BF" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="606" y1="490" x2="654" y2="490" stroke="#4E96BF" stroke-width="1" stroke-dasharray="3 3"/>
  <text transform="rotate(90 630 445)" x="630" y="445" text-anchor="middle" font-size="17" font-weight="bold" fill="#4E96BF">NIÑOS</text>
  <!-- BEBÉS izquierda fondo -->
  <rect x="210" y="650" width="60" height="320" fill="#FFE3D3" stroke="#D87A4A" stroke-width="1.5"/>
  <text transform="rotate(-90 240 810)" x="240" y="810" text-anchor="middle" font-size="17" font-weight="bold" fill="#D87A4A">BEBÉS</text>
