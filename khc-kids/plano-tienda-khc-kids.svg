  <rect x="240" y="975" width="180" height="82" rx="8" fill="#E3F3E0" stroke="#5C8A3C" stroke-width="1.5"/>
  <text x="330" y="1012" text-anchor="middle" font-size="13" font-weight="bold" fill="#5C8A3C">CAJA / MOSTRADOR</text>
