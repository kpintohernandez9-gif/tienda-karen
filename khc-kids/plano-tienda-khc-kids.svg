  <rect x="600" y="650" width="60" height="320" fill="#EDE0EF" stroke="#9170C4" stroke-width="1.5"/>
  <text transform="rotate(90 630 810)" x="630" y="810" text-anchor="middle" font-size="12" font-weight="bold" fill="#9170C4">PIJAMAS &amp; UNISEX</text>

  <!-- alfombra bebés -->
  <circle cx="320" cy="815" r="66" fill="#FFE3D3" opacity="0.5" stroke="#D87A4A" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="320" y="897" text-anchor="middle" font-size="11" fill="#D87A4A">alfombra ⌀1,1 m</text>

  <!-- ================= MESAS CENTRALES ================= -->
  <rect x="375" y="530" width="120" height="75" rx="6" fill="#FFF1CF" stroke="#E0A93A" stroke-width="1.5"/>
  <text x="435" y="560" text-anchor="middle" font-size="13" font-weight="bold" fill="#B07E1F">MESA 1</text>
  <text x="435" y="578" text-anchor="middle" font-size="11" fill="#B07E1F">OFERTAS</text>
  <text x="435" y="596" text-anchor="middle" font-size="10" fill="#9A8A92">0,8 × 0,5 m</text>
  <rect x="375" y="720" width="120" height="75" rx="6" fill="#FFF1CF" stroke="#E0A93A" stroke-width="1.5"/>
  <text x="435" y="750" text-anchor="middle" font-size="13" font-weight="bold" fill="#B07E1F">MESA 2</text>
  <text x="435" y="768" text-anchor="middle" font-size="11" fill="#B07E1F">COMBOS</text>
  <text x="435" y="786" text-anchor="middle" font-size="10" fill="#9A8A92">0,8 × 0,5 m</text>

